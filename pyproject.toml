#https://hatch.pypa.io/latest/config/build/

[project]
name = "tutor-tcs"
description = "True Course Simulations theme plugin for Tutor"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = { text = "AGPLv3" }
requires-python = ">=3.9"
authors = [{ name = "True Course Simulations" }]
maintainers = [{ name = "True Course Simulations" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
  "tutor-mfe>=20.0.0,<22.0.0", 
  "tutor>=20.0.0,<22.0.0"
]

# hatch_build.py will set it later
dynamic = ["version"]

[project.optional-dependencies]
dev = [
  "tutor[dev]>=20.0.0,<22.0.0",
  "ruff",
]

[project.entry-points."tutor.plugin.v1"]
tcs = "tutorindigo_tcs.plugin"

[project.urls]
Code = "https://github.com/True-Course-Simulations/tutor-indigo-tcs"
Community = "https://discuss.openedx.org"
Documentation = "https://docs.tutor.edly.io/"
Homepage = "https://github.com/True-Course-Simulations/tutor-indigo-tcs"
Changelog = "https://github.com/True-Course-Simulations/tutor-indigo-tcs/blob/release/CHANGELOG.md"
Issues = "https://github.com/True-Course-Simulations/tutor-indigo-tcs/issues"

# hatch related configurations
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Disable strict naming, otherwise twine is not able to detect name/version
strict-naming = false
include = ["/tutorindigo_tcs", ".hatch_build.py"]
exclude = ["tests*"]

# we need this becuase our project escapes default hatch file selection.
# see https://hatch.pypa.io/latest/plugins/builder/wheel/#default-file-selection
[tool.hatch.build.targets.wheel]
packages = ["/tutorindigo_tcs"]

[tool.hatch.metadata.hooks.custom]
path = ".hatch_build.py"

[tool.ruff]
exclude = ["templates", "docs/_ext"]

[tool.ruff.lint]
# E: pycodestyle errors
# I: isort
# N: pep8-naming
select = ["E", "I", "N"]

# F401: unused-import
# F841: unused-variable
# W292: missing-newline-at-end-of-file
extend-select = ["F401", "F841", "W292"]

[tool.ruff.format]
